            </div>

    <main>
        <section class="contact-page wrap">
            <div class="contact-page-copy">
                <h1>Tell me what you have in mind.</h1>
                <p>Share the quick version. If I can help, I’ll reply personally and we can find a time.</p>
            </div>

            <form action="https://formspree.io/f/mojjjrwe" method="POST" class="request-form contact-page-form">
                <label>
                    Your name
                    <input type="text" name="name" autocomplete="name" required>
                </label>
                <label>
                    Email
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label>
                    What’s this about?
                    <textarea name="message" rows="5" required></textarea>
                </label>
                <label class="consent request-consent"><input type="checkbox" name="marketing_consent" value="yes"> Email me occasional practical AI notes too.</label>
                <input type="hidden" name="form_type" value="Request time">
                <input type="hidden" name="subject" value="New request for time from luketyleranglin.github.io">
                <input class="honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
                <button class="button button-primary" type="submit">Send request <span aria-hidden="true">→</span></button>
            </form>
        </section>
    </main>
